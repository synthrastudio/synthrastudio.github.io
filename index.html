<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthra</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a14;color:#e8e8f0;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  .container{max-width:720px;margin:0 auto;padding:80px 24px;flex:1;width:100%}
  .logo{font-size:56px;font-weight:700;letter-spacing:-1.5px;background:linear-gradient(135deg,#00ff88,#00c4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .tagline{font-size:18px;color:#a0a0b0;margin-top:12px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#606070;margin:64px 0 20px}
  .app{padding:24px;background:#14141f;border-radius:14px;margin-bottom:12px;border:1px solid #1f1f2e}
  .app-name{font-weight:600;font-size:18px;margin-bottom:6px}
  .app-desc{color:#a0a0b0;font-size:14px}
  a{color:#00ff88;text-decoration:none}
  a:hover{text-decoration:underline}
  footer{padding:32px 24px;text-align:center;color:#606070;font-size:13px;border-top:1px solid #1a1a28}
  footer a{margin:0 12px;color:#a0a0b0}
</style>
</head>
<body>
<div class="container">
  <div class="logo">Synthra</div>
  <div class="tagline">Indie studio crafting games, apps, and AI experiences.</div>
  <h2>Apps</h2>
  <div class="app">
    <div class="app-name">MoneyClicker</div>
    <div class="app-desc">Tap your way from a lemonade stand to a global empire. Coming soon on the App Store.</div>
  </div>
</div>
<footer>
  <a href="/privacy">Privacy Policy</a> · <a href="/support">Support</a> · &copy; 2026 Synthra
</footer>
</body>
</html>
